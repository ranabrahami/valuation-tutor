    about_half: "About half of them"
    few_boxes: "Few or none of them"
    "yes": "Yes"
    "no": "No"
  trend_any_fall:
    prompt: "Did {company}'s {label} fall in any of the years shown?"
    why_yes: "Yes: it fell in {periods}. Look for a bar shorter than the one before it."
    why_no: "No: every bar from {first} to {last} is taller than the one before it."
  trend_peak:
    prompt: "In which year was {company}'s {label} highest?"
    why: "The tallest bar is {period}, at {value}."
  growth_direction:
    prompt: "Compare {company}'s growth in {last_period} with {first_period}. Is it growing faster, slower, or about the same?"
    why: "Growth was {first} in {first_period} and {last} in {last_period}. Read the small numbers above the bars, not the height of the bars."
  margin_per_hundred:
    prompt: "In {period}, out of every {symbol}100 of sales, roughly how much did {company} keep after the costs counted in its {label}?"
    why: "{label} was {value}, so about {symbol}{keep} of every {symbol}100 was left."
  margin_direction:
    prompt: "Between {first_period} and {last_period}, did {company}'s {label} go up, down or stay about the same?"
    why: "{label} was {first} in {first_period} and {last} in {last_period}."
  cash_vs_profit:
    prompt: "In {period}, which was bigger for {company}?"
    why: "{profit_label} was {profit} and {cash_label} was {cash}. Compare the bars for the latest year."
  peer_position:
    prompt: "Is {company}'s {label} above or below the median company in its peer group?"
    why: "{company} is at {value}; the median is {median}."
  peer_vs_peer:
    prompt: "Which is more expensive on {label}: {company} or {other}?"
    why: "{company} is at {value} and {other} at {other_value}. The longer bar is the more expensive one."
  fit_side:
    prompt: "Is {company} above or below the line that links {x} to price?"
    why: "{company} trades at {actual}; the line predicts about {line} for its {x}."
  value_gap:
    prompt: "Does the model value one share of {company} above or below today's price?"
    why: "The model says {value} per share; the market price is {price}."
  sensitivity_rate:
    prompt: "Start from the box with the thick border and move one row down, to a higher discount rate. What happens to the value?"
    why: "It goes from {base} to {higher} at a {rate} discount rate. A higher rate makes future cash worth less today."
  terminal_share:
    prompt: "Does more than half of the model's value for {company} come from the years after the forecast ends?"
    why: "{share} of the value comes from after the forecast. That's typical, and it's why long-term guesses matter so much."
  sensitivity_majority:
    prompt: "In how many boxes of the grid is the value above today's price of {price}?"
    why: "{above} of {total} boxes are above the price. The more boxes agree, the less the answer depends on the exact guesses."
  sensitivity_closest:
    prompt: "Stress test: which pair of assumptions makes the model's value closest to today's price of {price}?"
    option: "Discount rate {rate}, long-term growth {growth}"
    why: "That box gives {value}, the nearest to the price of {price}. These are roughly the assumptions the market is pricing in."
  implied_vs_actual:
    prompt: "Is today's price betting on faster or slower growth than {company} delivered last year?"
    why: "The price assumes about {implied} growth; last year it was {actual}."
  concepts:
    revenue:
      prompt: "A bakery sells 1,000 loaves at $3 each and spends $1,800 on flour and staff. What is its revenue?"
      options: ["$3,000", "$1,200", "$1,800"]
      answer: 0
      why: "Revenue is everything customers paid: 1,000 x $3 = $3,000, before any costs. $1,200 would be what's left after costs."
    growth:
      prompt: "Sales were $200M last year and $250M this year. What was the growth?"
      options: ["25%", "50%", "20%"]
      answer: 0
      why: "The increase is $50M, and $50M is 25% of last year's $200M. Growth is always measured against the earlier year."
    margin:
      prompt: "A company sells $100 of products and keeps $30 after its costs. What is its margin?"
      options: ["30%", "70%", "130%"]
      answer: 0
      why: "Margin is the share kept: $30 out of $100 is 30%. The 70% is what went to costs."
    free_cash_flow:
      prompt: "Which of these does free cash flow tell you?"
      options: ["The cash the business actually generated after investing in itself", "The profit shown in the accounts", "How much cash the company has in the bank"]
      answer: 0
      why: "Free cash flow is cash in from operations minus investment spending. Profit is an accounting figure, and money in the bank is a balance, not a flow."
    multiple:
      prompt: "Company A is worth $50B with $10B of sales. Company B is worth $20B with $2B of sales. Which is priced higher relative to its sales?"
      options: ["Company B", "Company A", "They're the same"]
      answer: 0
      why: "A trades at 5x sales ($50B ÷ $10B); B trades at 10x ($20B ÷ $2B). B is smaller but more expensive per dollar of sales."
    dcf:
      prompt: "Why is $100 you'll receive in 10 years worth less than $100 today?"
      options: ["Money today can be invested and earn a return, and the future is uncertain", "Because of taxes", "It isn't: $100 is always $100"]
      answer: 0
      why: "Money today can grow, and a promise of future money carries risk. A DCF shrinks future cash for exactly that reason."
    discount_rate:
      prompt: "If investors demand a higher return (a higher discount rate), what happens to a DCF value?"
      options: ["It goes down", "It goes up", "It doesn't change"]
      answer: 0
      why: "A higher rate shrinks future cash more when converting it to today's money, so the total value falls."
    implied_expectations:
      prompt: "A reverse DCF tells you..."
      options: ["what growth today's price is betting on", "what the company will grow next year", "whether you should buy the share"]
      answer: 0
      why: "It runs the model backwards from the price to the assumptions. It's a forecast hidden in the price, not a prediction or a recommendation."
