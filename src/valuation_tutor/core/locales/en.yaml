# Core strings, English. Sector content lives in each sector's own locale files.
# Placeholders in {braces} are filled in by the code; keep them when translating.
meta:
  direction: ltr
  name: English

fmt:
  missing: "n/a"
  billion: "B"
  million: "M"
  axis_billions: "{symbol} billions"
  axis_millions: "{symbol} millions"

chart_ui:
  period: "Year"
  source: "Source"
  value: "Value"
  measure: "Measure"
  company: "Company"
  median_label: "median {value}"
  price_today: "Share price today"
  model_value: "Value per share from the DCF model"
  growth_implied: "Growth today's price assumes"
  growth_actual: "Growth the company actually delivered"
