lessons:
  revenue:
    title: "Reading a revenue chart"
    intro: "Revenue is all the money a company takes in from customers. It's the first number analysts look at, because everything else (profit, cash, value) starts from it. Each bar on this chart is one year."
    look_prompt: "Before we explain anything: look at the bars. What do you notice?"
    takeaway: "Read the direction first, then the size of the steps."
  growth:
    title: "Growth: how fast is it getting bigger?"
    intro: "Growth is how much bigger revenue got than the year before, in percent. A company can keep getting bigger while its growth slows: both are true at once, and that's normal as companies mature."
    look_prompt: "Look at the small numbers above the bars. What's happening to them?"
    takeaway: "Bigger isn't the same as faster. Watch the growth numbers, not just the bars."
  margins:
    title: "Margins: how much of each sale is kept?"
    intro: "A margin is the share of each sale left over after certain costs. The gross margin counts only the direct costs of what was sold; the operating margin counts every cost of running the business."
    look_prompt: "There are two lines. What's the biggest difference between them?"
    takeaway: "A high gross margin means each extra sale is very profitable; the operating margin shows what's left after running the whole business."
  cash:
    title: "Profit on paper vs cash in the bank"
    intro: "Accounting profit and cash are different things. Some costs in the accounts never use cash, and some spending never shows up as a cost. Investors care about cash, because cash is what can be paid out or reinvested."
    look_prompt: "Compare the orange and blue bars. Do they tell the same story?"
    takeaway: "Always check cash, not just profit. They can point in opposite directions."
  multiples:
    title: "Multiples: is the price high or low?"
    intro: "A share price on its own says nothing: a $100 share isn't 'more expensive' than a $10 one. To compare companies, analysts divide the value of the business by its sales or profit. That's a multiple."
    look_prompt: "Find the blue bar. Where does this company sit in the group?"
    takeaway: "A multiple only means something next to similar companies, and a high one has to be earned."
  dcf:
    title: "What is the company worth on its own?"
    intro: "A DCF (discounted cash flow) model estimates all the cash a company will produce in the future, then shrinks each future dollar into what it's worth today, and adds them up. That gives a value per share to compare with the price."
    look_prompt: "Compare the two bars. What would you want to know before trusting the blue one?"
    takeaway: "The model's value is only as good as its guesses. A gap is a question, not an answer."
  sensitivity:
    title: "How much do the guesses matter?"
    intro: "A DCF needs two big guesses: the discount rate (the return investors demand) and long-term growth. This grid recalculates the value for different guesses, so you can see how much the answer depends on them."
    look_prompt: "Find the box with the thick border. What happens to the numbers as you move down a row?"
    takeaway: "If small changes in the guesses flip the answer, treat the answer with care."
  implied:
    title: "What is the price betting on?"
    intro: "Instead of asking 'what is it worth?', you can run the model backwards: what growth would make today's price fair? That shows what investors are betting on, which you can then compare with what the company actually delivers."
    look_prompt: "Compare the two bars. Is the market optimistic or cautious about this company?"
    takeaway: "Every price contains a forecast. Your job is to decide whether that forecast is believable."
  capstone:
    title: "Read a whole company"
    intro: "Time to put it together. Pick any company and answer one question from each stage: growth, cash, peers, value and what the price assumes."
    look_prompt: "Before you start: what do you already expect to find for this company?"
    takeaway: "That's the full analyst's read: the story, the business, the peers, the value and the market's bet."

