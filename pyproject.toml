[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation-tutor"
version = "0.1.0"
description = "Learn to read the charts and numbers behind a company's valuation, with an adaptive AI tutor."
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyyaml",
    "altair",
    "streamlit[auth]>=1.66",      # [auth]: Authlib, for "Sign in with Google"
    "python-dotenv",
    "sqlalchemy>=2",              # one storage layer for SQLite (local) and Postgres (deployed)
    "psycopg[binary]>=3",         # Postgres driver
]

[project.optional-dependencies]
# The SaaS sector wraps the saas-valuation-engine project. It is not on PyPI;
# install it next to this repo with: pip install -e ../saas-valuation-engine
ai = ["anthropic"]
dev = ["pytest", "playwright"]  # playwright: browser smoke test, uses local Chrome

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md", "*.csv", "*.json"]   # locale files and the SaaS data snapshot

[tool.pytest.ini_options]
testpaths = ["tests"]
