[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valuation-tutor"
version = "0.1.0"
description = "Learn to read the charts and numbers behind a company's valuation, with an adaptive AI tutor."
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyyaml",
    "altair",
    "streamlit>=1.66",
]

[project.optional-dependencies]
# The SaaS sector wraps the saas-valuation-engine project. It is not on PyPI;
# install it next to this repo with: pip install -e ../saas-valuation-engine
ai = ["anthropic"]
dev = ["pytest", "playwright"]  # playwright: browser smoke test, uses local Chrome

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
